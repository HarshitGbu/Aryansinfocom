name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + mypy + audit + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: agency
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d agency"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/agency
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check app tests
      - name: Mypy typecheck
        run: uv run mypy app
      - name: Dependency audit
        run: |
          req_file="$(mktemp)"
          trap 'rm -f "$req_file"' EXIT
          uv export --frozen --no-emit-project -o "$req_file"
          uvx pip-audit --require-hashes --disable-pip -r "$req_file"
      - name: OpenAPI contract diff
        run: |
          uv run python -m app.openapi_dump
          git diff --exit-code docs/openapi.json
      - name: Migrate + seed
        run: |
          uv run alembic upgrade head
          uv run python -m app.seed.seed
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/agency
      - name: Tests (coverage gate enforced in pyproject)
        run: uv run pytest -q

  frontend:
    name: Frontend (typecheck + lint + audit + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          # Build-time SEO/canonical base — CI does not need a live API.
          NEXT_PUBLIC_SITE_URL: https://aryansinfocom.com
